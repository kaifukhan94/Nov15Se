<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gamer Tag Bio Link</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================== -->
    <!-- Gamer Profile (Task 2) -->
    <!-- =========================== -->

    <div class="container my-5">

        <div class="profile text-center">

            <img src="avatar.jpg"
                class="profile-img"
                alt="Avatar">

            <h2 class="mt-3">
                ShadowHunter
            </h2>

            <p>
                Gamer | Streamer | Content Creator
            </p>

            <a href="#" class="btn btn-primary m-1">
                Twitch
            </a>

            <a href="#" class="btn btn-secondary m-1">
                Discord
            </a>

            <a href="#" class="btn btn-dark m-1">
                Steam
            </a>

        </div>

    </div>

    <!-- =========================== -->
    <!-- Social Links Form -->
    <!-- Task 1 + Task 3 -->
    <!-- =========================== -->

    <div class="container">

        <h3 class="text-center mb-4">

            Add Music Profiles

        </h3>

        <form id="musicLinksForm">

            <!-- Spotify -->

            <div class="input-group mb-3">

                <span class="input-group-text">

                    <i class="bi bi-spotify text-success"></i>

                </span>

                <input
                    type="url"
                    id="spotify"
                    class="form-control"
                    placeholder="Spotify Profile URL"
                    required>

            </div>

            <!-- YouTube Music -->

            <div class="input-group mb-3">

                <span class="input-group-text">

                    <i class="bi bi-youtube text-danger"></i>

                </span>

                <input
                    type="url"
                    id="youtube"
                    class="form-control"
                    placeholder="YouTube Music URL"
                    required>

            </div>

            <!-- Apple Music -->

            <div class="input-group mb-3">

                <span class="input-group-text">

                    <i class="bi bi-apple"></i>

                </span>

                <input
                    type="url"
                    id="apple"
                    class="form-control"
                    placeholder="Apple Music URL"
                    required>

            </div>

            <button
                class="btn btn-success"
                type="submit">

                Add Links

            </button>

        </form>

    </div>

    <!-- =========================== -->
    <!-- Preview Cards (Task 4) -->
    <!-- =========================== -->

    <div class="container mt-5">

        <h3 class="text-center">

            Music Profiles

        </h3>

        <div
            id="previewCards"
            class="row mt-4">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
