<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Utilities</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Flipkart Product Card</h2>

        <!-- ========================= -->
        <!-- Task 1 : Spacing Utilities -->
        <!-- ========================= -->

        <div class="card p-2 mb-5" style="width: 18rem;">

            <img src="phone.jpg" class="card-img-top" alt="Phone">

            <div class="card-body p-4">

                <h5 class="card-title">
                    Samsung Galaxy S25
                </h5>

            </div>

        </div>


        <h2 class="text-center mb-4">Zomato Restaurant Card</h2>

        <!-- ========================= -->
        <!-- Task 3 : Color Utilities -->
        <!-- ========================= -->

        <div class="card p-3" style="width: 20rem;">

            <h4>Spice Garden</h4>

            <!-- Green Color -->
            <p class="text-success">
                ⭐ Rating : 4.5
            </p>

            <!-- Blue Color -->
            <p class="text-primary">
                20% OFF on all orders
            </p>

            <!-- Red Color -->
            <p class="text-danger">
                Closed
            </p>

        </div>

    </div>

</body>

</html>
