<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style2.css">

</head>

<body>

    <!-- ========================= -->
    <!-- Task 5 : Theme Switcher -->
    <!-- ========================= -->

    <div class="container bg-light text-dark mt-5 p-4" id="theme">

        <!-- ========================= -->
        <!-- Task 2 : Typography Utilities -->
        <!-- ========================= -->

        <div class="card p-3">

            <h2 class="fw-bold">
                Avengers: Endgame
            </h2>

            <p class="fs-5 fw-semibold">
                ⭐ Rating : 4.8 / 5
            </p>

            <p class="fs-6">
                A thrilling superhero movie with amazing action and emotional scenes.
            </p>

            <!-- ========================= -->
            <!-- Task 4 : Custom Button -->
            <!-- ========================= -->

            <button class="btn btn-primary mt-3">
                Book Ticket
            </button>

            <button class="btn btn-dark mt-3" onclick="changeTheme()">
                Switch Theme
            </button>

        </div>

    </div>

    <script>

        function changeTheme() {

            let theme = document.getElementById("theme");

            theme.classList.toggle("bg-light");
            theme.classList.toggle("text-dark");

            theme.classList.toggle("bg-dark");
            theme.classList.toggle("text-light");

        }

    </script>

</body>

</html>
