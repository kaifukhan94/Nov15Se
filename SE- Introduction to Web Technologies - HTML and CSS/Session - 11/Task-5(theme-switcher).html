<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container bg-light text-dark p-5 mt-5" id="theme">

<h2>Movie Booking</h2>

<p>Welcome to BookMyShow</p>

<button class="btn btn-dark" onclick="changeTheme()">
Switch Theme
</button>

</div>

<script>

function changeTheme(){

let theme=document.getElementById("theme");

theme.classList.toggle("bg-light");
theme.classList.toggle("text-dark");

theme.classList.toggle("bg-dark");
theme.classList.toggle("text-light");

}

</script>

</body>

</html>
