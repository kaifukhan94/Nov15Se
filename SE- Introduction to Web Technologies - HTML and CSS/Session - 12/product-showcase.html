<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Showcase</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .card-img-top {

            height: 220px;
            width: 100%;
            object-fit: cover;

        }

    </style>

</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">

            Flipkart Product Showcase

        </h2>

        <div class="row">

            <!-- Product 1 -->

            <div class="col-6 col-md-3 mb-4">

                <div class="card">

                    <img src="product1.jpg" class="card-img-top" alt="Headphones">

                    <div class="card-body">

                        <h5 class="card-title">
                            Headphones
                        </h5>

                        <p class="card-text">
                            $59.99
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <!-- Product 2 -->

            <div class="col-6 col-md-3 mb-4">

                <div class="card">

                    <img src="product2.jpg" class="card-img-top" alt="Speaker">

                    <div class="card-body">

                        <h5 class="card-title">
                            Bluetooth Speaker
                        </h5>

                        <p class="card-text">
                            $79.99
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <!-- Product 3 -->

            <div class="col-6 col-md-3 mb-4">

                <div class="card">

                    <img src="product3.jpg" class="card-img-top" alt="Smart Watch">

                    <div class="card-body">

                        <h5 class="card-title">
                            Smart Watch
                        </h5>

                        <p class="card-text">
                            $149.99
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

            <!-- Product 4 -->

            <div class="col-6 col-md-3 mb-4">

                <div class="card">

                    <img src="product4.jpg" class="card-img-top" alt="Wireless Earbuds">

                    <div class="card-body">

                        <h5 class="card-title">
                            Wireless Earbuds
                        </h5>

                        <p class="card-text">
                            $89.99
                        </p>

                        <button class="btn btn-primary">
                            Buy Now
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
