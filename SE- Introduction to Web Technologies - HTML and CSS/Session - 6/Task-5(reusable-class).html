<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable CSS Class</title>

<style>

/* This reusable class avoids writing the same margin and padding
   multiple times, making the CSS easier to maintain. */

.spacing{
    margin:20px;
    padding:15px;
}

.card{
    border:2px solid black;
}

</style>

</head>
<body>

<div class="card spacing">

    <h2>Restaurant Card</h2>

    <p>North Indian Cuisine</p>

</div>

<div class="card spacing">

    <h2>Restaurant Card 2</h2>

    <p>Chinese Cuisine</p>

</div>

</body>
</html>
