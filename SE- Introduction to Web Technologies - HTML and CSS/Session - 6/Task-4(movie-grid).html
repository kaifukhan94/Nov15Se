<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Posters</title>

<style>

.poster{
    position:relative;
    display:inline-block;
    margin:20px;
}

.poster img{
    width:200px;
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    background:red;
    color:white;
    padding:5px 10px;
}

</style>

</head>
<body>

<div class="poster">

    <span class="badge">New</span>

    <img src="movie.jpg" alt="Movie">

</div>

<div class="poster">

    <img src="movie2.jpg" alt="Movie">

</div>

</body>
</html>
