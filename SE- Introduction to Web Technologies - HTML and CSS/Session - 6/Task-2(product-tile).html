<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Tile</title>

<style>

.product{
    border:1px solid black;
    width:220px;
    padding:15px;
}

.product img{
    width:100%;
}

.name{
    display:block;
    font-weight:bold;
}

.price{
    display:inline-block;
    color:green;
}

.hide-price{
    display:none;
}

</style>

</head>
<body>

<div class="product">

    <img src="phone.jpg" alt="Phone">

    <span class="name">Samsung Galaxy S25</span>

    <span class="price">₹69,999</span>

    <!-- To hide the price, change the line above to:
    <span class="price hide-price">₹69,999</span>
    -->

</div>

</body>
</html>
