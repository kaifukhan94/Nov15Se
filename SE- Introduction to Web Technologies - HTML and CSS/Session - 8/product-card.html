<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Task 1: Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Flipkart Product Card</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="product-card">

        <div class="image-section">
            <img src="phone.jpg" alt="Samsung Galaxy S25">
        </div>

        <div class="details">

            <h2>Samsung Galaxy S25</h2>

            <p class="price">₹69,999</p>

            <p>
                12GB RAM | 256GB Storage
            </p>

            <p>
                50MP Camera | 5000mAh Battery
            </p>

            <button>Buy Now</button>

        </div>

    </div>

</body>
</html>
