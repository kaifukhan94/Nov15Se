<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist</title>

    <style>

        .playlist-item{
            background-color: black;
            color: white;
            padding: 15px;
            margin: 10px;
        }

        #playing{
            background-color: green;
            color: white;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="playlist-item">
        Believer
    </div>

    <div class="playlist-item" id="playing">
        Shape of You
    </div>

    <div class="playlist-item">
        Perfect
    </div>

</body>
</html>
