<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms & Inputs</title>
</head>
<body>
    
    <h1>Zomato Food Order Form</h1>

    <form action="#" method="POST">

        <!-- Disabled because Order ID is generated by the system and should not be changed by the user. -->
        <label for="orderid">Order ID:</label><br>
        <input type="text" id="orderid" value="ORD12345" disabled>
        <br><br>

        <label for="customer">User Name:</label><br>
        <input type="text" id="customer" name="customer" required>
        <br><br>

        <label for="food">Food Item:</label><br>
        <select id="food" name="food" required>
            <option value="" selected disabled>Select Food</option>
            <option value="Pizza">Pizza</option>
            <option value="Burger">Burger</option>
            <option value="Biryani">Biryani</option>
        </select>
        <br><br>

        <label for="quantity">Quantity:</label><br>
        <input type="number"
               id="quantity"
               name="quantity"
               min="1"
               required>
        <br><br>

        <label for="instruction">Delivery Instructions:</label><br>
        <textarea
            id="instruction"
            name="instruction"
            rows="4"
            cols="40"
            required
            placeholder="Enter delivery instructions"></textarea>
        <br><br>

        <input type="submit" value="Place Order">

    </form>

</body>
</html>
