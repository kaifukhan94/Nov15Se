<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flipkart Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.card img{
    height:220px;
    object-fit:cover;
}

</style>

</head>

<body>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-4">

            <div class="card">

                <img src="phone1.jpg" class="card-img-top">

                <div class="card-body">

                    <h5>Samsung Galaxy S25</h5>

                    <p>₹69,999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <img src="phone2.jpg" class="card-img-top">

                <div class="card-body">

                    <h5>iPhone 17</h5>

                    <p>₹89,999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <img src="phone3.jpg" class="card-img-top">

                <div class="card-body">

                    <h5>OnePlus 14</h5>

                    <p>₹59,999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
