<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<article>

    <header>
        <h2>Spice Garden Restaurant</h2>
    </header>

    <p><strong>Cuisine:</strong> North Indian, Chinese</p>

    <p><strong>Location:</strong> Surat</p>

    <p>
        Delicious food with quick delivery and excellent customer service.
    </p>

    <footer>
        <p><i class="fa-solid fa-star"></i> Rating: 4.6/5</p>
        <p><i class="fa-solid fa-truck"></i> Delivery Time: 30 Minutes</p>
    </footer>

</article>

</body>
</html>
