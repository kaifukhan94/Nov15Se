<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Carousel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .carousel {
            max-width: 600px;
            margin: 30px auto;
        }

        .carousel-item img {
            height: 500px;
            width: 100%;
            object-fit: contain;
        }

        /* Change Previous & Next button color */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: black;
            border-radius: 50%;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2 class="text-center my-4">Featured Movies</h2>

        <div id="movieCarousel" class="carousel slide">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="movie1.jpg" class="d-block w-100" alt="Movie 1">

                    <div class="carousel-caption d-block">
                        <h5>Avengers: Endgame</h5>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="movie2.jpg" class="d-block w-100" alt="Movie 2">

                    <div class="carousel-caption d-block">
                        <h5>Spider-Man: No Way Home</h5>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="movie3.jpg" class="d-block w-100" alt="Movie 3">

                    <div class="carousel-caption d-block">
                        <h5>Interstellar</h5>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
