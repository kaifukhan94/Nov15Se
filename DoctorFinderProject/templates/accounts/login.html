{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="text-center">
                        Login
                    </h3>

                </div>

                <div class="card-body">

                   <form method="POST">

    {% csrf_token %}

    {% for field in form %}

        <div class="mb-3">

            <label class="form-label">

                {{ field.label }}

            </label>

            {{ field }}

        </div>

    {% endfor %}

    <button class="btn btn-success w-100">

        Login

    </button>

</form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
