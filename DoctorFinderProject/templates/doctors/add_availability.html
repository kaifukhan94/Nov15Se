{% extends 'base.html' %}

{% block title %}
Add Availability
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3>Add Availability</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {% for field in form %}

                            <div class="mb-3">

                                <label class="form-label">

                                    {{ field.label }}

                                </label>

                                {{ field }}

                                {% if field.errors %}

                                    <div class="text-danger">

                                        {{ field.errors }}

                                    </div>

                                {% endif %}

                            </div>

                        {% endfor %}

                        <button type="submit" class="btn btn-success w-100">

                            Save Availability

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
